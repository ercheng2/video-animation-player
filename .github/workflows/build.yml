name: Build VideoAnimationPlayer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python pillow numpy

      - name: Build with PyInstaller (spec file)
        run: |
          pyinstaller --clean VideoAnimationPlayer.spec

      - name: Verify built exe
        run: |
          dir dist\VideoAnimationPlayer.exe
          python -c "
import subprocess, os
# 检查exe是否存在且大于10MB
size = os.path.getsize('dist\\VideoAnimationPlayer.exe')
print(f'EXE size: {size} bytes ({size/1024/1024:.1f} MB)')
assert size > 10*1024*1024, 'EXE too small, something wrong'
print('EXE size check passed')
"

      - name: Create Release ZIP
        run: |
          mkdir release
          copy dist\VideoAnimationPlayer.exe release\
          copy requirements.txt release\
          cd release
          7z a -tzip ..\VideoAnimationPlayer_v1.zip VideoAnimationPlayer.exe requirements.txt

      - name: Delete old release (if exists)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes 2>$null
          git tag -d v1.0 2>$null
          git push origin --delete v1.0 2>$null

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 --title "VideoAnimationPlayer v1.0" --notes "视频动画播放控制 v1.0 发布" VideoAnimationPlayer_v1.zip