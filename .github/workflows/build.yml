name: Build VideoAnimationPlayer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python pillow numpy

      - name: Build with PyInstaller
        run: pyinstaller --clean VideoAnimationPlayer.spec

      - name: Create Release ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item dist\VideoAnimationPlayer.exe release\
          Copy-Item requirements.txt release\
          Compress-Archive -Path release\* -DestinationPath VideoAnimationPlayer_v1.zip -Force

      - name: Delete old release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes
          git tag -d v1.0
          git push origin --delete v1.0

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 --title "VideoAnimationPlayer v1.0" --notes "视频动画播放控制 v1.0" VideoAnimationPlayer_v1.zip